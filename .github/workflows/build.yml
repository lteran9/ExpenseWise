name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: ["10.0.x"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-test
          MYSQL_DATABASE: expensewise_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Migrate test database
        env:
          Database__Host: 127.0.0.1
          Database__Port: "3306"
          Database__Name: expensewise_test
          Database__Username: root
          Database__Password: integration-test
        run: dotnet run --project src/Presentation/Api --no-build -- --migrate
      - name: Test
        env:
          EXPENSEWISE_TEST_MYSQL_CONNECTION: "Server=127.0.0.1;Port=3306;Database=expensewise_test;User ID=root;Password="
          Database__Password: integration-test
        run: dotnet test --no-build --verbosity normal

  acceptance:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Create disposable local configuration
        run: |
          cp .env.example .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^JWT_SIGNING_KEY=.*|JWT_SIGNING_KEY=$(openssl rand -base64 48)|" .env
      - name: Start Compose stack on a fresh volume
        run: docker compose up --build -d
      - name: Check UI is reachable
        run: |
          for _ in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          exit 1
      - name: Run Phase 1 API acceptance checks
        run: scripts/acceptance-api.sh
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove stack and disposable volume
        if: always()
        run: docker compose down -v
