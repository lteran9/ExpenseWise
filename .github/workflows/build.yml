name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: ["10.0.x"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-test
          MYSQL_DATABASE: expensewise_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Migrate test database
        env:
          Database__Host: 127.0.0.1
          Database__Port: "3306"
          Database__Name: expensewise_test
          Database__Username: root
          Database__Password: integration-test
        run: dotnet run --project src/Presentation/Api --no-build -- --migrate
      - name: Test
        env:
          EXPENSEWISE_TEST_MYSQL_CONNECTION: "Server=127.0.0.1;Port=3306;Database=expensewise_test;User ID=root;Password="
          Database__Password: integration-test
        run: dotnet test --no-build --verbosity normal

  docker-acceptance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPENSEWISE_UI_URL: http://localhost:8080
      EXPENSEWISE_API_URL: http://localhost:8081
      EXPENSEWISE_ACCEPTANCE_ARTIFACTS: ${{ github.workspace }}/acceptance-artifacts
      COMPOSE_PROJECT_NAME: ewci

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Write throwaway Compose configuration
        run: |
          {
            echo "DB_DATABASE=expensewise"
            echo "DB_USERNAME=expensewise"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SIGNING_KEY=$(openssl rand -base64 48)"
          } > .env
      - name: Start stack on a fresh volume
        run: docker compose up -d --build
      - name: Wait for UI and API
        run: bash .github/scripts/wait-for-stack.sh "$EXPENSEWISE_UI_URL" "$EXPENSEWISE_API_URL"
      - name: Build acceptance tests and install Chromium
        run: |
          dotnet build src/Tests/Acceptance
          pwsh src/Tests/Acceptance/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
      - name: Scenario A and access boundaries
        run: dotnet test src/Tests/Acceptance --no-build --filter "Category=Scenario" --logger "console;verbosity=normal"
      - name: Restart stack with its existing volume
        run: |
          docker compose down
          docker compose up -d
          bash .github/scripts/wait-for-stack.sh "$EXPENSEWISE_UI_URL" "$EXPENSEWISE_API_URL"
          docker compose logs migrate | grep "No migrations were applied"
      - name: Scenario A data survives restart
        run: dotnet test src/Tests/Acceptance --no-build --filter "Category=AfterRestart" --logger "console;verbosity=normal"
      - name: Collect Compose logs
        if: failure()
        run: |
          mkdir -p acceptance-artifacts
          docker compose logs --no-color > acceptance-artifacts/compose.log 2>&1
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-acceptance-diagnostics
          path: acceptance-artifacts/
      - name: Tear down
        if: always()
        run: docker compose down -v
