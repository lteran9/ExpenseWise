services:
  webapi:
    build:
      context: .
      dockerfile: src/Presentation/Api/Dockerfile
    image: "expensewise-api-1:latest"
    environment:
      Database__Host: mysql
      Database__Port: "3306"
      Database__Name: "${DB_DATABASE:?DB_DATABASE must be set}"
      Database__Username: "${DB_USERNAME:?DB_USERNAME must be set}"
      Database__Password: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set}"
    ports:
      - '${API_PORT:-8081}:8081'
    networks:
      - network
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: .
      dockerfile: src/Presentation/Api/Dockerfile
    image: "expensewise-api-1:latest"
    command: ["--migrate"]
    restart: "no"
    environment:
      Database__Host: mysql
      Database__Port: "3306"
      Database__Name: "${DB_DATABASE:?DB_DATABASE must be set}"
      Database__Username: "${DB_USERNAME:?DB_USERNAME must be set}"
      Database__Password: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    networks:
      - network
    depends_on:
      mysql:
        condition: service_healthy
  webapp:
    build:
      context: .
      dockerfile: src/Presentation/UI/Dockerfile
    image: "expensewise-ui-1:latest"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ExpenseWiseApi__BaseUrl: "http://webapi:8081/"
      Database__Host: mysql
      Database__Port: "3306"
      Database__Name: "${DB_DATABASE:?DB_DATABASE must be set}"
      Database__Username: "${DB_USERNAME:?DB_USERNAME must be set}"
      Database__Password: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    ports:
      - '${UI_PORT:-8080}:8080'
    networks:
      - network
    depends_on:
      webapi:
        condition: service_started
      migrate:
        condition: service_completed_successfully
  mysql:
    image: "mysql:8.0"
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      MYSQL_DATABASE: "${DB_DATABASE:?DB_DATABASE must be set}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME must be set}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      TZ: "America/Phoenix"
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-time-zone=-07:00",
      ]
    volumes:
      - "expensewise-mysql:/var/lib/mysql"
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      retries: 12
      timeout: 5s
      start_period: 20s
networks:
  network:
    driver: bridge
volumes:
  expensewise-mysql:
    driver: local
